<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProtoMatter — contact</title>
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg:#0d0d10; --card:#16161b; --line:#292932; --ink:#f3f3f6;
    --dim:#9797a4; --accent:#d62828; --ok:#2e9e5b; --r:14px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f5f8;--card:#fff;--line:#e3e3ea;--ink:#14141a;--dim:#6a6a78}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; padding:28px 16px 56px;
    -webkit-text-size-adjust:100%;
  }
  .wrap{width:100%; max-width:420px}

  /* ---- identity ---- */
  .who{text-align:center; margin-bottom:24px}
  .avatar{
    width:72px;height:72px;border-radius:50%;
    background:var(--accent); color:#fff;
    font-size:30px; font-weight:700; line-height:72px;
    margin:0 auto 12px; letter-spacing:-.02em;
  }
  .who h1{margin:0; font-size:23px; letter-spacing:-.02em}
  .who .role{color:var(--dim); font-size:15px; margin-top:3px}

  /* ---- action list ---- */
  .actions{display:flex; flex-direction:column; gap:10px}
  .act{
    display:flex; align-items:center; gap:14px;
    padding:15px 16px; text-decoration:none;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); color:var(--ink);
    font-size:16px; font-weight:500; cursor:pointer;
    width:100%; text-align:left; font-family:inherit;
  }
  .act:active{transform:translateY(1px)}
  .act .ico{
    width:38px;height:38px;border-radius:10px;flex:none;
    display:grid;place-items:center;font-size:18px;
    background:#22222a; color:var(--ink);
  }
  @media (prefers-color-scheme: light){ .act .ico{background:#f0f0f5} }
  .act .txt{flex:1; min-width:0}
  .act .sub{display:block; color:var(--dim); font-size:12.5px; font-weight:400}
  .act .arrow{color:var(--dim); font-size:18px; flex:none}
  .act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .act.primary .ico{background:rgba(255,255,255,.18); color:#fff}
  .act.primary .sub, .act.primary .arrow{color:rgba(255,255,255,.82)}

  /* ---- form ---- */
  #formPanel{
    display:none; margin-top:12px; padding:16px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  }
  label{display:block; font-size:12.5px; color:var(--dim); margin:12px 0 5px}
  label:first-of-type{margin-top:0}
  .req::after{content:" *"; color:var(--accent)}
  input,textarea{
    width:100%; padding:12px 13px; font:inherit; font-size:16px; /* 16px: stops iOS zoom */
    color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:10px;
  }
  input:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  textarea{min-height:72px; resize:vertical}
  .send{
    width:100%; margin-top:16px; padding:14px; font:inherit; font-size:16px;
    font-weight:600; color:#fff; background:var(--accent);
    border:0; border-radius:var(--r); cursor:pointer;
  }
  .send[disabled]{opacity:.6; cursor:default}
  .err{color:#ff8a80; font-size:13px; margin-top:10px; display:none}
  .hint{color:var(--dim); font-size:11.5px; margin-top:10px; text-align:center}

  #done{display:none; text-align:center; padding:26px 8px}
  #done h2{margin:0 0 6px; font-size:19px}
  #done p{color:var(--dim); margin:0; font-size:14px}
  .tick{
    width:50px;height:50px;border-radius:50%;background:var(--ok);
    color:#fff;font-size:26px;line-height:50px;margin:0 auto 12px;
  }
  .ref{margin-top:22px; text-align:center; color:#54545e; font-size:10.5px; letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">

  <div class="who">
    <div class="avatar" id="initials">--</div>
    <h1 id="name">&nbsp;</h1>
    <div class="role" id="role">&nbsp;</div>
  </div>

  <div class="actions" id="actions"></div>

  <!-- Revealed by the "Send me your details" action -->
  <div id="formPanel">
    <form id="form" novalidate>
      <label class="req" for="fname">Your name</label>
      <input id="fname" name="name" type="text" autocomplete="name"
             enterkeyhint="next" required placeholder="Ada Lovelace">

      <label class="req" for="femail">Email</label>
      <input id="femail" name="email" type="email" autocomplete="email"
             inputmode="email" enterkeyhint="next" required placeholder="ada@example.com">

      <label for="fphone">Phone</label>
      <input id="fphone" name="phone" type="tel" autocomplete="tel"
             inputmode="tel" enterkeyhint="next" placeholder="Optional">

      <label for="fcompany">Company</label>
      <input id="fcompany" name="company" type="text" autocomplete="organization"
             enterkeyhint="next" placeholder="Optional">

      <label for="fnote">What are you working on?</label>
      <textarea id="fnote" name="note" enterkeyhint="send"
                placeholder="So I remember the conversation."></textarea>

      <input type="hidden" name="_subject" id="subjField" value="New contact from a card">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <!-- FormSubmit mails this straight back to whoever submitted, so they
           get your details without you lifting a finger. -->
      <input type="hidden" name="_autoresponse" id="autoField" value="">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <input type="hidden" name="card" id="cardField" value="">

      <button class="send" id="sendBtn" type="submit">Send</button>
      <div class="err" id="err"></div>
      <div class="hint">Straight to my inbox. No list, nothing else.</div>
    </form>

    <div id="done">
      <div class="tick">&#10003;</div>
      <h2>Got it &mdash; thanks.</h2>
      <p id="doneMsg">I'll be in touch shortly.</p>
    </div>
  </div>

  <div class="ref" id="ref"></div>
</div>

<script>
/* ==================================================================
   EDIT THIS. Everything below it is wiring.
   ================================================================== */
const CONFIG = {
  name:    "Douglas",
  role:    "CEO",
  company: "ProtoMatter Labs",
  email:   "automatolabs@gmail.com",
  phone:   "",                              // e.g. "+15555551234"
  site:    "https://automatolabs.com",
  links:   [
    // { label:"LinkedIn", sub:"connect", icon:"in", url:"https://linkedin.com/in/..." },
  ],

  // Where the form posts. Empty = test mode: it validates and shows the
  // success screen without sending anything, so the page can be checked
  // before any relay is wired up.
  //   Formspree:  https://formspree.io/f/xxxxxxx
  //   FormSubmit: https://formsubmit.co/ajax/<alias>
  endpoint: "",

  // Mailed straight back to anyone who submits the form, automatically.
  // Works on FormSubmit for free; Formspree calls it an autoresponse.
  autoResponse: [
    "Thanks for the details — good to meet you.",
    "",
    "Here are mine:",
    "{{name}}",
    "{{role}} at {{company}}",
    "{{email}}",
    "{{site}}",
    "",
    "I'll follow up properly shortly."
  ].join("\n"),

  emailSubject: "Nice meeting you",
  emailBody:    "Name:\nEmail:\nPhone:\n",
  smsBody:      ""      // filled in below if left blank
};
/* ================================================================== */

const cardId = new URLSearchParams(location.search).get("c") || "";

CONFIG.smsBody = CONFIG.smsBody ||
  "Hi! Saving your details.\n\n" + CONFIG.company + "\n" + CONFIG.email +
  "\n" + CONFIG.site + "\n\nMine are:\nName:\nEmail:\n";

// --- identity ---
document.getElementById("name").textContent = CONFIG.name;
document.getElementById("role").textContent =
  [CONFIG.role, CONFIG.company].filter(Boolean).join(" · ");
document.getElementById("initials").textContent =
  CONFIG.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";

document.getElementById("autoField").value = CONFIG.autoResponse
  .replace(/{{name}}/g, CONFIG.name)
  .replace(/{{role}}/g, CONFIG.role)
  .replace(/{{company}}/g, CONFIG.company)
  .replace(/{{email}}/g, CONFIG.email)
  .replace(/{{site}}/g, CONFIG.site);

if (cardId) {
  document.getElementById("cardField").value = cardId;
  document.getElementById("subjField").value = "New contact from card: " + cardId;
  document.getElementById("ref").textContent = "card " + cardId;
}

/* vCard is built here rather than hosted, so there is no second file and
   nothing that can fail while someone is standing in front of you.
   CRLF because the spec requires it and some parsers are strict. */
function vcard(c) {
  const bits = c.name.trim().split(/\s+/);
  const last = bits.length > 1 ? bits[bits.length - 1] : c.name;
  const first = bits.length > 1 ? bits.slice(0, -1).join(" ") : "";
  const rows = ["BEGIN:VCARD", "VERSION:3.0",
                "N:" + last + ";" + first + ";;;", "FN:" + c.name];
  if (c.company) rows.push("ORG:" + c.company);
  if (c.role)    rows.push("TITLE:" + c.role);
  if (c.phone)   rows.push("TEL;TYPE=CELL:" + c.phone);
  if (c.email)   rows.push("EMAIL;TYPE=INTERNET:" + c.email);
  if (c.site)    rows.push("URL:" + c.site);
  rows.push("END:VCARD");
  return rows.join("\r\n") + "\r\n";
}

const vcfUrl = URL.createObjectURL(new Blob([vcard(CONFIG)], {type:"text/vcard;charset=utf-8"}));

// --- build the action list ---
const actions = [];

actions.push({
  primary:true, icon:"\u{1F4C7}", label:"Save my contact",
  sub:"adds me to your phone", href:vcfUrl,
  download:CONFIG.name.replace(/\s+/g,"-").toLowerCase() + ".vcf"
});

actions.push({
  icon:"\u{2709}", label:"Email me", sub:"opens a message, already addressed",
  href:"mailto:" + CONFIG.email +
       "?subject=" + encodeURIComponent(CONFIG.emailSubject) +
       "&body=" + encodeURIComponent(CONFIG.emailBody)
});

if (CONFIG.phone) {
  actions.push({
    icon:"\u{1F4AC}", label:"Text me", sub:"opens a text, already written",
    href:"sms:" + CONFIG.phone + "?body=" + encodeURIComponent(CONFIG.smsBody)
  });
  actions.push({ icon:"\u{1F4DE}", label:"Call me", sub:CONFIG.phone,
                 href:"tel:" + CONFIG.phone });
}

if (CONFIG.site) {
  actions.push({ icon:"\u{1F310}", label:"Our website",
                 sub:CONFIG.site.replace(/^https?:\/\//,""), href:CONFIG.site });
}

CONFIG.links.forEach(l => actions.push({ icon:l.icon || "\u{1F517}",
                                         label:l.label, sub:l.sub || "", href:l.url }));

actions.push({
  icon:"\u{1F4E4}", label:"Send me your details",
  sub:"your phone fills it in — one tap", action:"form"
});

const list = document.getElementById("actions");
actions.forEach(a => {
  const el = document.createElement(a.href ? "a" : "button");
  el.className = "act" + (a.primary ? " primary" : "");
  if (a.href) {
    el.href = a.href;
    if (a.download) el.download = a.download;
    if (/^https?:/.test(a.href)) { el.target = "_blank"; el.rel = "noopener"; }
  } else {
    el.type = "button";
  }
  el.innerHTML =
    '<span class="ico">' + a.icon + '</span>' +
    '<span class="txt">' + a.label +
      (a.sub ? '<span class="sub">' + a.sub + '</span>' : '') +
    '</span><span class="arrow">›</span>';
  if (a.action === "form") {
    el.addEventListener("click", () => {
      const panel = document.getElementById("formPanel");
      panel.style.display = "block";
      el.style.display = "none";
      panel.scrollIntoView({behavior:"smooth", block:"nearest"});
      document.getElementById("fname").focus({preventScroll:true});
    });
  }
  list.appendChild(el);
});

// --- form submit ---
const form = document.getElementById("form");
const sendBtn = document.getElementById("sendBtn");
const err = document.getElementById("err");

function fail(html) {
  err.innerHTML = html;
  err.style.display = "block";
  sendBtn.disabled = false;
  sendBtn.textContent = "Send";
}

function succeed(message) {
  form.style.display = "none";
  const done = document.getElementById("done");
  if (message) document.getElementById("doneMsg").textContent = message;
  done.style.display = "block";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  err.style.display = "none";

  const name = form.name.value.trim();
  const email = form.email.value.trim();
  if (!name) return fail("Please add your name.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("That email does not look right.");

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";

  if (!CONFIG.endpoint) {
    console.log("TEST MODE — would have sent:", Object.fromEntries(new FormData(form)));
    return succeed("Test mode — nothing was sent. Set CONFIG.endpoint to go live.");
  }

  try {
    const response = await fetch(CONFIG.endpoint, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body:JSON.stringify(Object.fromEntries(new FormData(form)))
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    succeed();
  } catch (e) {
    // Never strand someone mid-exchange: hand them their own mail app,
    // already filled in with everything they just typed.
    const body = "Name: " + name + "\nEmail: " + email +
                 "\nPhone: " + form.phone.value + "\nCompany: " + form.company.value +
                 "\n\n" + form.note.value;
    fail('Could not send just now. <a style="color:#ff8a80" href="mailto:' + CONFIG.email +
         "?subject=" + encodeURIComponent("Contact from card " + cardId) +
         "&body=" + encodeURIComponent(body) + '">Email it instead</a>.');
  }
});
</script>
</body>
</html>
